const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

const CATEGORY_EMOJI = {
  Main: '\u{1F37D}\uFE0F',
  Side: '\u{1F957}',
  Salad: '\u{1F959}',
  Soup: '\u{1F372}',
  Snack: '\u{1F37F}',
  Sauce: '\u{1FAD2}',
  Pasta: '\u{1F35D}',
};

const MealPlanner = () => {
  const [activeTab, setActiveTab] = useState('recipes');
  const [searchTerm, setSearchTerm] = useState('');
  const [filterCategory, setFilterCategory] = useState('All');
  const [filterCuisine, setFilterCuisine] = useState('All');
  const [filterProtein, setFilterProtein] = useState('All');
  const [expandedRecipe, setExpandedRecipe] = useState(null);
  const [mealsPerDay, setMealsPerDay] = useState(2);
  const [numPeople, setNumPeople] = useState(2);
  const [mealPlan, setMealPlan] = useState({});
  const [shoppingListChecked, setShoppingListChecked] = useState({});
  const [copiedToClipboard, setCopiedToClipboard] = useState(false);
  const [cookingDays, setCookingDays] = useState(() => {
    const initial = {};
    DAYS.forEach(day => { initial[day] = true; });
    return initial;
  });

  const filteredRecipes = useMemo(() => {
    return RECIPES.filter((recipe) => {
      const matchesSearch = recipe.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        recipe.ingredients.some(ing => ing.toLowerCase().includes(searchTerm.toLowerCase()));
      const matchesCategory = filterCategory === 'All' || recipe.category === filterCategory;
      const matchesCuisine = filterCuisine === 'All' || recipe.cuisine === filterCuisine;
      const matchesProtein = filterProtein === 'All' || recipe.protein === filterProtein;
      return matchesSearch && matchesCategory && matchesCuisine && matchesProtein;
    });
  }, [searchTerm, filterCategory, filterCuisine, filterProtein]);

  const categories = useMemo(() => ['All', ...new Set(RECIPES.map(r => r.category))], []);
  const cuisines = useMemo(() => ['All', ...new Set(RECIPES.map(r => r.cuisine))], []);
  const proteins = useMemo(() => ['All', ...new Set(RECIPES.map(r => r.protein))], []);

  const initializeMealPlan = useCallback(() => {
    const newPlan = {};
    DAYS.forEach((day) => {
      newPlan[day] = Array(mealsPerDay).fill(null);
    });
    setMealPlan(newPlan);
  }, [mealsPerDay]);

  const toggleCookingDay = useCallback((day) => {
    setCookingDays(prev => ({ ...prev, [day]: !prev[day] }));
    setMealPlan(prev => ({
      ...prev,
      [day]: prev[day]?.map(() => null) || Array(mealsPerDay).fill(null)
    }));
  }, [mealsPerDay]);

  const autoFillWeek = useCallback(() => {
    const newPlan = {};
    DAYS.forEach((day) => {
      if (!cookingDays[day]) {
        newPlan[day] = Array(mealsPerDay).fill(null);
        return;
      }
      const meals = [];
      const mains = filteredRecipes.filter(r => r.category === 'Main' || r.category === 'Pasta');
      const pool = mains.length > 0 ? mains : filteredRecipes;
      for (let i = 0; i < mealsPerDay; i++) {
        const randomRecipe = pool[Math.floor(Math.random() * pool.length)];
        meals.push(randomRecipe);
      }
      newPlan[day] = meals;
    });
    setMealPlan(newPlan);
  }, [mealsPerDay, filteredRecipes, cookingDays]);

  const selectRecipe = useCallback((day, mealIndex, recipe) => {
    setMealPlan(prev => ({
      ...prev,
      [day]: prev[day].map((meal, idx) => (idx === mealIndex ? recipe : meal))
    }));
  }, []);

  const removeMeal = useCallback((day, mealIndex) => {
    setMealPlan(prev => ({
      ...prev,
      [day]: prev[day].map((meal, idx) => (idx === mealIndex ? null : meal))
    }));
  }, []);

  const regenerateMeal = useCallback((day, mealIndex) => {
    if (filteredRecipes.length > 0) {
      const randomRecipe = filteredRecipes[Math.floor(Math.random() * filteredRecipes.length)];
      selectRecipe(day, mealIndex, randomRecipe);
    }
  }, [filteredRecipes, selectRecipe]);

  const shoppingList = useMemo(() => {
    const items = {};
    Object.values(mealPlan).forEach((meals) => {
      meals.forEach((meal) => {
        if (meal) {
          meal.ingredients.forEach((ingredient) => {
            const key = ingredient.toLowerCase().replace(/^[\d\/\.\s]+(oz|lb|cup|cups|tbsp|tsp|can|bunch|head|inch|pint|ear|block|ball|stalk|clove|cloves|large|medium|small|pinch|splash)s?\b\s*/i, '').replace(/^\s*of\s+/, '').replace(/,.*$/, '').replace(/\(.*\)/, '').trim();
            if (key) items[key] = (items[key] || 0) + (numPeople / 2);
          });
        }
      });
    });

    const sections = {
      Produce: [],
      Protein: [],
      Dairy: [],
      Pantry: [],
      'Grains/Pasta': [],
      Spices: [],
      Other: [],
    };

    const produceKeywords = ['carrot', 'onion', 'garlic', 'lettuce', 'greens', 'spinach', 'kale', 'tomato', 'cucumber', 'pepper', 'broccoli', 'cauliflower', 'eggplant', 'squash', 'zucchini', 'radish', 'celery', 'bean', 'pea', 'lemon', 'lime', 'orange', 'apple', 'grape', 'peach', 'mango', 'pineapple', 'mint', 'cilantro', 'parsley', 'basil', 'dill', 'artichoke', 'asparagus', 'turnip', 'mushroom', 'scallion', 'shallot', 'beet', 'cabbage', 'corn', 'snap pea', 'bok choy', 'arugula', 'tomatillo', 'jalape', 'poblano', 'avocado', 'potato', 'sprout', 'brussels', 'herb', 'thyme', 'rosemary', 'lemongrass', 'ginger'];
    const proteinKeywords = ['chicken', 'beef', 'shrimp', 'salmon', 'fish', 'tofu', 'egg', 'meatball', 'sausage', 'halibut', 'snapper', 'tuna', 'steak', 'chickpea', 'lentil', 'edamame'];
    const dairyKeywords = ['cheese', 'milk', 'cream', 'yogurt', 'butter', 'ricotta', 'feta', 'parmesan', 'cottage', 'burrata', 'mayo', 'goat cheese'];
    const grainsKeywords = ['rice', 'pasta', 'noodle', 'quinoa', 'couscous', 'orzo', 'linguine', 'tortilla', 'focaccia', 'breadcrumb', 'oat', 'farro', 'grain', 'pita', 'flatbread', 'tortellini', 'vermicelli', 'rice paper', 'crouton'];
    const spiceKeywords = ['paprika', 'cumin', 'spice', 'cinnamon', 'curry', 'gochujang', 'harissa', 'sumac', 'zaatar', 'sesame', 'chili', 'red pepper flake', 'turmeric', 'coriander', 'garam masala', 'oregano'];

    Object.entries(items).forEach(([item, qty]) => {
      const lower = item.toLowerCase();
      let section = 'Other';
      if (produceKeywords.some(kw => lower.includes(kw))) section = 'Produce';
      else if (proteinKeywords.some(kw => lower.includes(kw))) section = 'Protein';
      else if (dairyKeywords.some(kw => lower.includes(kw))) section = 'Dairy';
      else if (grainsKeywords.some(kw => lower.includes(kw))) section = 'Grains/Pasta';
      else if (spiceKeywords.some(kw => lower.includes(kw))) section = 'Spices';
      else if (lower.includes('oil') || lower.includes('sauce') || lower.includes('vinegar') || lower.includes('honey') || lower.includes('maple') || lower.includes('peanut butter') || lower.includes('tahini') || lower.includes('miso') || lower.includes('pesto') || lower.includes('teriyaki') || lower.includes('fish sauce') || lower.includes('soy sauce') || lower.includes('mirin') || lower.includes('sriracha')) section = 'Pantry';
      sections[section].push({ item, qty: Math.round(qty * 10) / 10 });
    });

    return sections;
  }, [mealPlan, numPeople]);

  const copyShoppingListToClipboard = useCallback(() => {
    const text = Object.entries(shoppingList)
      .filter(([_, items]) => items.length > 0)
      .map(([section, items]) => `${section}:\n${items.map(i => `- ${i.item}${i.qty > 1 ? ` (x${i.qty})` : ''}`).join('\n')}`)
      .join('\n\n');
    navigator.clipboard.writeText(text);
    setCopiedToClipboard(true);
    setTimeout(() => setCopiedToClipboard(false), 2000);
  }, [shoppingList]);

  useEffect(() => {
    initializeMealPlan();
  }, [mealsPerDay, initializeMealPlan]);

  return (
    <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50">
      {/* Header */}
      <header className="sticky top-0 z-40 bg-white shadow-sm border-b-2 border-amber-200">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="text-4xl">{'\u{1F37D}\uFE0F'}</div>
              <h1 className="text-3xl font-bold text-amber-900">Weekly Meal Planner</h1>
            </div>
          </div>
        </div>
      </header>

      {/* Navigation Tabs */}
      <div className="sticky top-[73px] z-30 bg-white border-b border-amber-200 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="flex gap-8">
            {[
              { id: 'recipes', label: '\u{1F4D6} Recipes' },
              { id: 'planner', label: '\u{1F4C5} Planner' },
              { id: 'shopping', label: '\u{1F6D2} Shopping List' },
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-6 py-4 font-semibold border-b-2 transition-all ${
                  activeTab === tab.id
                    ? 'border-amber-500 text-amber-900'
                    : 'border-transparent text-gray-600 hover:text-amber-700'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Main Content */}
      <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {/* Recipes Tab */}
        {activeTab === 'recipes' && (
          <div className="space-y-6">
            <div className="space-y-4">
              <div className="relative">
                <span className="absolute left-4 top-3 text-gray-400 text-lg">{'\u{1F50D}'}</span>
                <input
                  type="text"
                  placeholder="Search recipes or ingredients..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full pl-12 pr-4 py-3 border-2 border-amber-200 rounded-lg focus:outline-none focus:border-amber-500 transition-colors"
                />
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <select value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)}
                  className="px-4 py-2 border-2 border-amber-200 rounded-lg focus:outline-none focus:border-amber-500 transition-colors">
                  {categories.map(cat => (
                    <option key={cat} value={cat}>{cat === 'All' ? 'All Categories' : cat}</option>
                  ))}
                </select>
                <select value={filterCuisine} onChange={(e) => setFilterCuisine(e.target.value)}
                  className="px-4 py-2 border-2 border-amber-200 rounded-lg focus:outline-none focus:border-amber-500 transition-colors">
                  {cuisines.map(c => (
                    <option key={c} value={c}>{c === 'All' ? 'All Cuisines' : c}</option>
                  ))}
                </select>
                <select value={filterProtein} onChange={(e) => setFilterProtein(e.target.value)}
                  className="px-4 py-2 border-2 border-amber-200 rounded-lg focus:outline-none focus:border-amber-500 transition-colors">
                  {proteins.map(p => (
                    <option key={p} value={p}>{p === 'All' ? 'All Proteins' : p}</option>
                  ))}
                </select>
              </div>

              <p className="text-sm text-gray-600">Found {filteredRecipes.length} recipes</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredRecipes.map((recipe) => (
                <div
                  key={recipe.id}
                  className="bg-white border-2 border-amber-200 rounded-lg overflow-hidden hover:shadow-lg hover:border-amber-400 transition-all cursor-pointer"
                  onClick={() => setExpandedRecipe(expandedRecipe === recipe.id ? null : recipe.id)}
                >
                  <div className="p-5 space-y-3">
                    <div className="flex items-start justify-between gap-3">
                      <h3 className="font-bold text-amber-900 text-lg flex-1">{recipe.name}</h3>
                      <div className="text-2xl">{CATEGORY_EMOJI[recipe.category] || '\u{1F37D}\uFE0F'}</div>
                    </div>

                    <div className="flex flex-wrap gap-2">
                      <span className="px-3 py-1 bg-orange-100 text-orange-800 text-xs font-semibold rounded-full">{recipe.category}</span>
                      <span className="px-3 py-1 bg-amber-100 text-amber-800 text-xs font-semibold rounded-full">{recipe.cuisine}</span>
                      <span className="px-3 py-1 bg-yellow-100 text-yellow-800 text-xs font-semibold rounded-full">{recipe.protein}</span>
                    </div>

                    <div className="flex gap-4 text-sm text-gray-600">
                      <span>{'\u23F1\uFE0F'} {recipe.prepTime} min</span>
                      <span>{'\u{1F465}'} {recipe.servings}</span>
                      <span>{recipe.difficulty}</span>
                    </div>

                    <div className="text-sm text-gray-700">
                      <p className="font-semibold mb-2">Key ingredients:</p>
                      <p className="line-clamp-2">{recipe.ingredients.slice(0, 3).join(', ')}</p>
                    </div>

                    {expandedRecipe === recipe.id && (
                      <div className="mt-4 pt-4 border-t-2 border-amber-100 space-y-4">
                        <div>
                          <p className="font-semibold text-amber-900 mb-2">All Ingredients:</p>
                          <ul className="text-sm text-gray-700 space-y-1">
                            {recipe.ingredients.map((ing, idx) => (
                              <li key={idx} className="flex items-center gap-2">
                                <span className="text-amber-500">{'\u2022'}</span> {ing}
                              </li>
                            ))}
                          </ul>
                        </div>
                        {recipe.instructions && (
                          <div>
                            <p className="font-semibold text-amber-900 mb-2">Instructions:</p>
                            <ol className="text-sm text-gray-700 space-y-2">
                              {recipe.instructions.map((step, idx) => (
                                <li key={idx} className="flex gap-3">
                                  <span className="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full flex items-center justify-center text-xs font-bold">{idx + 1}</span>
                                  <span>{step}</span>
                                </li>
                              ))}
                            </ol>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Planner Tab */}
        {activeTab === 'planner' && (
          <div className="space-y-6">
            <div className="bg-white border-2 border-amber-200 rounded-lg p-6 space-y-4">
              <h2 className="text-xl font-bold text-amber-900">Meal Plan Settings</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Meals per Day</label>
                  <select value={mealsPerDay} onChange={(e) => setMealsPerDay(Number(e.target.value))}
                    className="w-full px-4 py-2 border-2 border-amber-200 rounded-lg focus:outline-none focus:border-amber-500">
                    {[1, 2, 3].map(n => (
                      <option key={n} value={n}>{n} Meal{n > 1 ? 's' : ''} per Day</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Number of People</label>
                  <select value={numPeople} onChange={(e) => setNumPeople(Number(e.target.value))}
                    className="w-full px-4 py-2 border-2 border-amber-200 rounded-lg focus:outline-none focus:border-amber-500">
                    {[1, 2, 3, 4, 5, 6].map(n => (
                      <option key={n} value={n}>{n} Person{n > 1 ? 's' : ''}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="space-y-3">
                <h3 className="text-lg font-semibold text-amber-900">Which days are you cooking?</h3>
                <p className="text-sm text-gray-600">Uncheck days you plan to eat out, have leftovers, or skip cooking.</p>
                <div className="flex flex-wrap gap-3">
                  {DAYS.map((day) => (
                    <label key={day}
                      className={`flex items-center gap-2 px-4 py-2.5 rounded-lg border-2 cursor-pointer transition-all select-none ${
                        cookingDays[day]
                          ? 'border-amber-400 bg-amber-50 text-amber-900'
                          : 'border-gray-200 bg-gray-50 text-gray-400'
                      }`}>
                      <input type="checkbox" checked={cookingDays[day]} onChange={() => toggleCookingDay(day)}
                        className="w-4 h-4 accent-amber-500 rounded" />
                      <span className="font-semibold text-sm">{day}</span>
                    </label>
                  ))}
                </div>
                <p className="text-xs text-gray-500">
                  {DAYS.filter(d => cookingDays[d]).length} cooking day{DAYS.filter(d => cookingDays[d]).length !== 1 ? 's' : ''} selected
                </p>
              </div>

              <button onClick={autoFillWeek}
                className="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold py-3 px-6 rounded-lg hover:from-amber-600 hover:to-orange-600 transition-all flex items-center justify-center gap-2">
                {'\u{1F500}'} Auto-fill Week with Random Recipes
              </button>
            </div>

            <div className="space-y-4">
              {DAYS.map((day) => (
                <div key={day} className={`border-2 rounded-lg overflow-hidden transition-all ${
                  cookingDays[day] ? 'bg-white border-amber-200' : 'bg-gray-50 border-gray-200 opacity-50'
                }`}>
                  <div className={`font-bold p-4 flex items-center justify-between ${
                    cookingDays[day]
                      ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white'
                      : 'bg-gray-300 text-gray-600'
                  }`}>
                    <span>{day}</span>
                    {!cookingDays[day] && <span className="text-sm font-normal italic">Not cooking</span>}
                  </div>
                  {cookingDays[day] && <div className="p-4 space-y-3">
                    {mealPlan[day]?.map((meal, idx) => (
                      <div key={idx} className="flex gap-3 items-center">
                        <span className="text-sm font-semibold text-gray-600 min-w-fit">Meal {idx + 1}:</span>
                        <div className="flex-1">
                          {meal ? (
                            <div className="bg-amber-50 border-2 border-amber-300 rounded p-3 flex items-center justify-between">
                              <span className="font-semibold text-amber-900">{meal.name}</span>
                              <div className="flex gap-2">
                                <button onClick={() => regenerateMeal(day, idx)}
                                  className="p-2 hover:bg-amber-200 rounded transition-colors" title="Swap this meal">
                                  {'\u{1F504}'}
                                </button>
                                <button onClick={() => removeMeal(day, idx)}
                                  className="p-2 hover:bg-red-200 rounded transition-colors" title="Remove this meal">
                                  {'\u2715'}
                                </button>
                              </div>
                            </div>
                          ) : (
                            <select
                              onChange={(e) => {
                                const recipe = RECIPES.find(r => r.id === Number(e.target.value));
                                if (recipe) selectRecipe(day, idx, recipe);
                              }}
                              className="w-full px-3 py-2 border-2 border-amber-300 rounded bg-white text-gray-700 focus:outline-none focus:border-amber-500"
                              defaultValue="">
                              <option value="">Select a recipe...</option>
                              {RECIPES.map(recipe => (
                                <option key={recipe.id} value={recipe.id}>{recipe.name}</option>
                              ))}
                            </select>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Shopping List Tab */}
        {activeTab === 'shopping' && (
          <div className="space-y-6">
            <div className="flex items-center justify-between">
              <h2 className="text-2xl font-bold text-amber-900">Shopping List</h2>
              <button onClick={copyShoppingListToClipboard}
                className="flex items-center gap-2 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold py-2 px-4 rounded-lg hover:from-amber-600 hover:to-orange-600 transition-all">
                {copiedToClipboard ? '\u2713 Copied!' : '\u{1F4CB} Copy to Clipboard'}
              </button>
            </div>

            {Object.values(mealPlan).every(meals => meals.every(m => m === null)) ? (
              <div className="bg-amber-50 border-2 border-amber-300 rounded-lg p-8 text-center">
                <p className="text-amber-900 font-semibold text-lg">No meals planned yet!</p>
                <p className="text-gray-600 mt-2">Go to the Planner tab to create your meal plan.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {Object.entries(shoppingList)
                  .filter(([_, items]) => items.length > 0)
                  .map(([section, items]) => (
                    <div key={section} className="bg-white border-2 border-amber-200 rounded-lg p-6">
                      <h3 className="text-lg font-bold text-amber-900 mb-4">{section}</h3>
                      <ul className="space-y-2">
                        {items.map((item, idx) => (
                          <li key={idx} className="flex items-center gap-3">
                            <input type="checkbox"
                              checked={shoppingListChecked[`${section}-${idx}`] || false}
                              onChange={(e) => {
                                setShoppingListChecked(prev => ({
                                  ...prev, [`${section}-${idx}`]: e.target.checked
                                }));
                              }}
                              className="w-5 h-5 rounded border-2 border-amber-300 text-amber-500 cursor-pointer" />
                            <span className={`flex-1 ${shoppingListChecked[`${section}-${idx}`] ? 'line-through text-gray-400' : 'text-gray-800'}`}>
                              {item.item} {item.qty > 1 ? `(x${item.qty})` : ''}
                            </span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
              </div>
            )}
          </div>
        )}
      </main>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MealPlanner />);
  </script>
</body>
</html>
